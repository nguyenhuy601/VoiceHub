services:
  api-gateway:
    # npm ci theo lockfile (commit trong git); fallback npm install nếu chưa có lock.
    command: ["sh", "-c", "npm ci || npm install; node /shared/postinstall-link.cjs; npm run dev"]
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"

  auth-service:
    command: ["sh", "-c", "npm ci || npm install; node /shared/postinstall-link.cjs; npm run dev"]
