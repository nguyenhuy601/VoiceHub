# Infra / AI bổ sung cho Swarm dev — gắn overlay voicehub_enterprise-network
# DNS alias: minio, ollama, paddleocr-service, meilisearch (app Swarm gọi cùng hostname).
# Ollama + PaddleOCR chỉ chạy ở đây, không còn trong docker-stack.yml.
#
#   bash devops/swarm/dev-enable-profile.sh

name: voicehub-extra

services:
  ollama:
    image: ollama/ollama:latest
    platform: linux/amd64
    volumes:
      - ollama_data:/root/.ollama
    mem_limit: 3072m
    cpus: 4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 45s
    networks:
      enterprise-network:
        aliases:
          - ollama

  paddleocr-service:
    image: blazordevlab/paddleocrapi:latest
    platform: linux/amd64
    mem_limit: 512m
    cpus: 2
    restart: unless-stopped
    networks:
      enterprise-network:
        aliases:
          - paddleocr-service

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    platform: linux/amd64
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      enterprise-network:
        aliases:
          - minio

  minio-init:
    image: minio/mc:latest
    platform: linux/amd64
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-meeting-recordings}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      exit 0
      "
    networks:
      - enterprise-network

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_ENV: ${MEILI_ENV}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      enterprise-network:
        aliases:
          - meilisearch

  voice-recording-worker:
    build:
      context: .
      dockerfile: services/voice-recording-worker/Dockerfile
    env_file:
      - .env
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_QUORUM_QUEUES: ${RABBITMQ_QUORUM_QUEUES:-true}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN}
      VOICE_SERVICE_URL: ${VOICE_SERVICE_URL}
    depends_on:
      minio-init:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    restart: unless-stopped
    networks:
      - enterprise-network

  voice-stt-worker:
    build:
      context: .
      dockerfile: services/voice-stt-worker/Dockerfile
    env_file:
      - .env
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_QUORUM_QUEUES: ${RABBITMQ_QUORUM_QUEUES:-true}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN}
      VOICE_SERVICE_URL: ${VOICE_SERVICE_URL}
      VOICE_STT_PROVIDER: ${VOICE_STT_PROVIDER:-self_hosted}
    depends_on:
      minio-init:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    restart: unless-stopped
    networks:
      - enterprise-network

volumes:
  ollama_data:
  minio_data:
  meilisearch_data:

networks:
  enterprise-network:
    external: true
    name: ${ENTERPRISE_NETWORK_NAME:-voicehub_enterprise-network}
