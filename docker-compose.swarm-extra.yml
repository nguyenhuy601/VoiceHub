# Infra bổ sung cho Swarm dev — gắn overlay voicehub_enterprise-network
# DNS alias minio / meilisearch để stack voicehub resolve được.
#
#   bash devops/swarm/dev-enable-profile.sh

name: voicehub-extra

services:
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      enterprise-network:
        aliases:
          - minio

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-meeting-recordings}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      exit 0
      "
    networks:
      - enterprise-network

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_ENV: ${MEILI_ENV}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      enterprise-network:
        aliases:
          - meilisearch

  voice-recording-worker:
    build:
      context: .
      dockerfile: services/voice-recording-worker/Dockerfile
    env_file:
      - .env
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN}
      VOICE_SERVICE_URL: ${VOICE_SERVICE_URL}
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - enterprise-network

volumes:
  minio_data:
  meilisearch_data:

networks:
  enterprise-network:
    external: true
    name: ${ENTERPRISE_NETWORK_NAME:-voicehub_enterprise-network}
