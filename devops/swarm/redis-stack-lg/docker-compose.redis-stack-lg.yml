# Optional Redis Stack (RedisJSON) — chỉ cho LangGraph in-run HITL checkpointer.
# App cache vẫn dùng redis:7-alpine / Sentinel. Không thay REDIS_HOST toàn stack.
#
# Deploy: bash devops/swarm/redis-stack-lg/deploy-redis-stack-lg.sh
# Down:   bash devops/swarm/redis-stack-lg/deploy-redis-stack-lg.sh --down

services:
  redis-lg:
    image: ${REDIS_STACK_LG_IMAGE:-redis/redis-stack-server:7.4.0-v1}
    hostname: redis-lg
    environment:
      # Overlay nội bộ — không publish port; không auth (chỉ mạng Swarm).
      # Không snapshot mỗi phút: entrypoint nối ${REDIS_ARGS} không quote được `--save ""`.
      # Ngưỡng 1e9 key/giờ = tắt BGSAVE thực tế. Fork lúc RSS sát limit bị OOM ("Killed")
      # và client LangGraph nhận read ECONNRESET. maxmemory + allkeys-lru chặn phình vô hạn.
      REDIS_ARGS: "--save 3600 1000000000 --maxmemory 512mb --maxmemory-policy allkeys-lru --loglevel notice"
    volumes:
      - redis_lg_data:/data
    networks:
      - enterprise-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 768M
        reservations:
          cpus: "0.10"
          memory: 128M

volumes:
  redis_lg_data:

networks:
  enterprise-network:
    external: true
    name: ${ENTERPRISE_NETWORK_NAME:-voicehub_enterprise-network}
