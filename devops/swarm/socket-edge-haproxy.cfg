# Sticky edge for Socket.IO — host Nginx :3017 → Swarm (nhiều task socket-service).
# Dùng source affinity theo X-Real-IP (Nginx). Không stick sid (DNS slot đổi IP sẽ
# học sai server). Redis adapter vẫn cần fan-out event.
# S2S nội bộ: DNS VIP socket-service:3017 (không qua edge).

global
  log stdout format raw local0
  maxconn 8192

defaults
  log global
  mode http
  option httplog
  option dontlognull
  timeout connect 5s
  timeout client 3600s
  timeout server 3600s
  timeout tunnel 3600s
  timeout http-keep-alive 60s
  timeout http-request 60s

resolvers docker_dns
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 2s
  timeout retry 1s
  # Giữ IP ổn định hơn — tránh gán lại slot giữa handshake và POST polling.
  hold valid 30s
  hold obsolete 30s
  hold other 10s
  hold refused 10s
  hold nx 10s
  hold timeout 10s

frontend socket_fe
  bind *:3017
  # Ghim balance theo IP client thật (Nginx X-Real-IP), không phải IP ingress.
  http-request set-src hdr(X-Real-IP) if { hdr(X-Real-IP) -m ip }
  default_backend socket_be

backend socket_be
  balance source
  hash-type consistent

  option forwardfor
  option httpchk GET /health
  http-check expect status 200

  # Khớp SOCKET_SERVICE_REPLICAS (staging=2). Slot dư → DNS gán trùng/nhảy IP.
  server-template sock 2 tasks.socket-service:3017 resolvers docker_dns resolve-prefer ipv4 init-addr none check inter 3s fall 2 rise 1
