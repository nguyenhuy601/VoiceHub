# P2-Edge — Nginx TLS trước Docker Swarm staging (API + WS only)
# Không proxy Vite — dùng dev-https.conf khi dev LAN với HMR.
#
# Prerequisites:
#   - api-gateway published :3000 (Swarm ingress)
#   - api-gateway/.env TRUST_PROXY=1
#   - mkcert certs in devops/nginx/certs/
#
# Run:
#   nginx -p D:/VoiceHub/devops/nginx -c staging-swarm-edge.conf
#
# Client: VITE_API_URL=/api, VITE_SOCKET_USE_GATEWAY=true (xem docs/lan-https-voicehub.local.md)

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 55m;

  upstream voicehub_gateway {
    server 127.0.0.1:3000;
    keepalive 32;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name voicehub.local staging.voicehub.local;

    ssl_certificate     certs/voicehub.local+3.pem;
    ssl_certificate_key certs/voicehub.local+3-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    # Optional: redirect HTTP → HTTPS (uncomment if listen 80 added)
    # location / { return 301 https://$host$request_uri; }

    location /api/ {
      proxy_pass http://voicehub_gateway;
      proxy_http_version 1.1;
      proxy_set_header Authorization $http_authorization;
      proxy_read_timeout 120s;
    }

    location /uploads/ {
      proxy_pass http://voicehub_gateway;
      proxy_http_version 1.1;
    }

    location /socket.io/ {
      proxy_pass http://voicehub_gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /voice-socket/ {
      proxy_pass http://voicehub_gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Swarm-only: no Vite — health via API
    location = / {
      return 302 /api/health/gateway-trust;
    }
  }
}
