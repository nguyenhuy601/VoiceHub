# P3-Edge — Staging prod-like: static SPA (client/dist) + gateway API/WS
# P5-Cloudflare — production template: devops/nginx/cloudflare/prod-edge.cf.example.conf
#   CF Origin CA + server_name app.example.com; WS 3600s; see docs/phase5-dns-tls.md
# Không proxy Vite — dùng dev-https.conf cho dev HMR.
#
# Prerequisites:
#   bash devops/scripts/build-client-static.sh
#   api-gateway published :3000, TRUST_PROXY=1
#   mkcert certs in devops/nginx/certs/
#
# Run (stop other nginx on :443 first):
#   nginx -p D:/VoiceHub/devops/nginx -c prod-edge.conf
#   hoặc devops/nginx/start-prod-edge.bat
#
# Verify:
#   bash devops/nginx/verify-prod-edge.sh

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;
  client_max_body_size 50m;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=api_login:10m rate=5r/m;

  upstream voicehub_gateway {
    server 127.0.0.1:3000;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name voicehub.local staging.voicehub.local;

    ssl_certificate     certs/voicehub.local+3.pem;
    ssl_certificate_key certs/voicehub.local+3-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    # P3 security headers (staging mkcert)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss: https:; img-src 'self' data: blob: https:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'self';" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    # Relative to nginx -p prefix (devops/nginx)
    root ../../client/dist;
    index index.html;

    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss: https:; img-src 'self' data: blob: https:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'self';" always;
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss: https:; img-src 'self' data: blob: https:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'self';" always;
    }

    location = /api/health {
      proxy_pass http://voicehub_gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Authorization $http_authorization;
      proxy_read_timeout 120s;
    }

    location = /api/health/gateway-trust {
      proxy_pass http://voicehub_gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 120s;
    }

    location /api/auth/login {
      limit_req zone=api_login burst=5 nodelay;
      proxy_pass http://voicehub_gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Authorization $http_authorization;
      proxy_read_timeout 120s;
    }

    location /api/ {
      limit_req zone=api_general burst=20 nodelay;
      proxy_pass http://voicehub_gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Authorization $http_authorization;
      proxy_read_timeout 120s;
    }

    location /uploads/ {
      proxy_pass http://voicehub_gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # P5-WS — WebSocket upgrade (CF orange cloud → origin; idle timeout tier-dependent)
    location /socket.io/ {
      proxy_pass http://voicehub_gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /voice-socket/ {
      proxy_pass http://voicehub_gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # P5-WS — voice signaling WS (same CF path as chat socket)
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
