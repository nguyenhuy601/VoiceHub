# P5 — Example nginx server block for Cloudflare origin (copy/adapt)
# Not loaded by default — merge into prod-edge.conf or include when CF cutover ready.
#
# Prerequisites:
#   - CF Origin CA in devops/nginx/certs/cf-origin.pem + cf-origin-key.pem
#   - api-gateway :3000, TRUST_PROXY=1
#   - bash devops/scripts/build-client-static.sh
#
# Replace app.example.com with your production hostname.

  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.example.com staging.app.example.com;

    ssl_certificate     certs/cf-origin.pem;
    ssl_certificate_key certs/cf-origin-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    # CF terminates client TLS; origin sees CF → trust X-Forwarded-* (gateway TRUST_PROXY=1)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss: https:; img-src 'self' data: blob: https:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'self';" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # Optional: CF-Connecting-IP when lockdown CF-only
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

    root ../../client/dist;
    index index.html;

    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }

    location = /api/health {
      proxy_pass http://voicehub_gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 120s;
    }

    location /api/auth/login {
      limit_req zone=api_login burst=5 nodelay;
      proxy_pass http://voicehub_gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 120s;
    }

    location /api/ {
      limit_req zone=api_general burst=20 nodelay;
      proxy_pass http://voicehub_gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 120s;
    }

    # P5-WS — CF WebSocket proxy (idle timeout tier-dependent; client reconnect exists)
    location /socket.io/ {
      proxy_pass http://voicehub_gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /voice-socket/ {
      proxy_pass http://voicehub_gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
