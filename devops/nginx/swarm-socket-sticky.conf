# Nginx trong overlay: chat và voice signaling đi thẳng service, REST vẫn qua gateway.
# ip_hash ghim client khi upstream có nhiều địa chỉ task. VIP Swarm một địa chỉ thì đặt 1 replica
# hoặc liệt kê IP task. Redis adapter vẫn cần để chuyển event sang replica đang giữ kết nối.
upstream voicehub_socket_upstream {
    ip_hash;
    server socket-service:3017;
}

upstream voicehub_voice_signal_upstream {
    ip_hash;
    server voice-service:3005;
}

location /socket.io/ {
    proxy_pass http://voicehub_socket_upstream/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /voice-socket/ {
    proxy_pass http://voicehub_voice_signal_upstream/voice-socket/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
