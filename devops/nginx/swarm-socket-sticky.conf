# Nginx trong overlay (hiếm): chat/voice thẳng service. Host Nginx :3017 → dùng socket-edge
# (devops/swarm/socket-edge-haproxy.cfg) — VIP một địa chỉ không sticky được giữa nhiều task.
# ip_hash chỉ có hiệu lực khi upstream liệt kê nhiều IP task (không phải DNS VIP).
# Redis adapter vẫn cần fan-out event sang replica đang giữ kết nối.
upstream voicehub_socket_upstream {
    ip_hash;
    server socket-service:3017;
}

upstream voicehub_voice_signal_upstream {
    ip_hash;
    server voice-service:3005;
}

location /socket.io/ {
    proxy_pass http://voicehub_socket_upstream/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /voice-socket/ {
    proxy_pass http://voicehub_voice_signal_upstream/voice-socket/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
