  ai-task-worker:

    build:
      context: .
      dockerfile: services/ai-task-worker/Dockerfile

    container_name: enterprise-ai-task-worker

    env_file:

      - .env

      - ./services/ai-task-worker/.env

    environment:

      RABBITMQ_URL: ${RABBITMQ_URL}

      CHAT_INTERNAL_TOKEN: ${CHAT_INTERNAL_TOKEN}

      USER_SERVICE_INTERNAL_TOKEN: ${USER_SERVICE_INTERNAL_TOKEN}

    depends_on:

      mongodb:

        condition: service_started

      rabbitmq:

        condition: service_healthy

      ollama:

        condition: service_started

      paddleocr-service:

        condition: service_started

