  summary-service:

    build:
      context: .
      dockerfile: services/summary-service/Dockerfile

    container_name: enterprise-summary-service

    env_file:

      - .env

      - ./services/summary-service/.env

    environment:

      RABBITMQ_URL: ${RABBITMQ_URL}

      CHAT_SERVICE_URL: ${CHAT_SERVICE_URL}

      CHAT_INTERNAL_TOKEN: ${CHAT_INTERNAL_TOKEN}

      ORGANIZATION_SERVICE_URL: ${ORGANIZATION_SERVICE_URL}

      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN}

    depends_on:

      mongodb:

        condition: service_started

      rabbitmq:

        condition: service_healthy

      chat-service:

        condition: service_started

      organization-service:

        condition: service_started

    networks:

      - enterprise-network

    volumes:

      - ./services/summary-service:/app

      - ./shared:/shared

      - /app/node_modules

    command: ["sh", "-c", "npm ci || npm install; node /shared/postinstall-link.cjs; node src/server.js"]



  summary-worker:

    build:
      context: .
      dockerfile: services/summary-worker/Dockerfile

    container_name: enterprise-summary-worker

    env_file:

      - .env

      - ./services/summary-worker/.env

    environment:

