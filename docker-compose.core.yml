  voice-recording-worker:

    build:
      context: .
      dockerfile: services/voice-recording-worker/Dockerfile

    container_name: enterprise-voice-recording-worker

    env_file:

      - .env

      - ./services/voice-recording-worker/.env

    environment:

      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672

      RABBITMQ_QUORUM_QUEUES: ${RABBITMQ_QUORUM_QUEUES:-true}

      MINIO_ENDPOINT: ${MINIO_ENDPOINT}

      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}

      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}

      MINIO_BUCKET: ${MINIO_BUCKET}

      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}

      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN}

      VOICE_SERVICE_URL: ${VOICE_SERVICE_URL}

    depends_on:

      mongodb:

        condition: service_started

      rabbitmq:

        condition: service_healthy

      minio:

        condition: service_healthy

      minio-init:

        condition: service_completed_successfully

      ollama:

        condition: service_started

      voice-service:

        condition: service_started

    networks:

      - enterprise-network

    volumes:

      - ./services/voice-recording-worker:/app



  voice-stt-worker:

    build:
      context: .
      dockerfile: services/voice-stt-worker/Dockerfile

    container_name: enterprise-voice-stt-worker

    env_file:

