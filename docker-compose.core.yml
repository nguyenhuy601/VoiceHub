  voice-service:

    build:
      context: .
      dockerfile: services/voice-service/Dockerfile

    container_name: enterprise-voice-service

    ports:

      - "3005:3005"

      - "40000-40100:40000-40100/udp"

      - "40000-40100:40000-40100/tcp"

    env_file:

      - .env

      - ./services/voice-service/.env

    environment:

      REALTIME_INTERNAL_TOKEN: ${REALTIME_INTERNAL_TOKEN}

      CHAT_INTERNAL_TOKEN: ${CHAT_INTERNAL_TOKEN}

      USER_SERVICE_INTERNAL_TOKEN: ${USER_SERVICE_INTERNAL_TOKEN}

      NOTIFICATION_INTERNAL_TOKEN: ${NOTIFICATION_INTERNAL_TOKEN}

      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN}

      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672

      MINIO_ENDPOINT: ${MINIO_ENDPOINT}

      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}

      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}

      MINIO_BUCKET: ${MINIO_BUCKET}

      MINIO_REGION: ${MINIO_REGION}

      MINIO_USE_SSL: ${MINIO_USE_SSL}

      VOICE_RECORDING_ENABLED: ${VOICE_RECORDING_ENABLED}

    depends_on:

      - mongodb

      - redis

      - rabbitmq

      - minio

      - socket-service

      - chat-service

      - notification-service

    networks:

      - enterprise-network

    volumes:

      - ./services/voice-service:/app

      - ./shared:/shared

      - /app/node_modules



