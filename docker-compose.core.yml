# Core: API Gateway + microservices (không gồm Mongo/Redis — xem docker-compose.infra.yml)

# File này được gộp qua docker-compose.yml (include). Hoặc chạy tay:

# docker compose -f docker-compose.infra.yml -f docker-compose.core.yml up -d

#

# URL service / token / secret: chỉ trong `.env` (root) + `services/<name>/.env` — không hardcode trong khối environment.

# Khối environment bên dưới chỉ pass-through ${VAR} từ host (tránh Windows ghi đè rỗng) hoặc flag runtime.

#

# Bề mặt mạng: chỉ publish api-gateway (+ voice-service cho WebRTC). Các service khác chỉ enterprise-network.



services:

  api-gateway:

    build:
      context: .
      dockerfile: api-gateway/Dockerfile

    container_name: enterprise-api-gateway

    ports:

      - "3000:3000"

    env_file:

      - .env

      - ./api-gateway/.env

    environment:

      REDIS_HOST: ${REDIS_HOST}

      REDIS_PORT: ${REDIS_PORT}

      BFF_CACHE_ENABLED: ${BFF_CACHE_ENABLED}

      BFF_BOOTSTRAP_CACHE_TTL_SEC: ${BFF_BOOTSTRAP_CACHE_TTL_SEC}

      BFF_SHELL_CACHE_TTL_SEC: ${BFF_SHELL_CACHE_TTL_SEC}

      BFF_DASHBOARD_CACHE_TTL_SEC: ${BFF_DASHBOARD_CACHE_TTL_SEC}

      BFF_DOCUMENTS_OVERVIEW_CACHE_TTL_SEC: ${BFF_DOCUMENTS_OVERVIEW_CACHE_TTL_SEC}

      BFF_SHELL_TIMEOUT_MS: ${BFF_SHELL_TIMEOUT_MS}

    depends_on:

      - redis

      - auth-service

      - user-service

      - friend-service

      - organization-service

      - role-permission-service

      - chat-service

      - voice-service

      - task-service

      - ai-task-service

      - summary-service

      - document-service

      - notification-service

      - webhook-service

    networks:

      - enterprise-network

    volumes:

      - ./api-gateway:/app

      - ./shared:/shared

      - /app/node_modules

    command: ["sh", "-c", "npm ci || npm install; node /shared/postinstall-link.cjs; node src/server.js"]



  auth-service:

    build:
      context: .
      dockerfile: services/auth-service/Dockerfile

    container_name: enterprise-auth-service

    env_file:

      - .env

      - ./services/auth-service/.env

    environment:

      USER_SERVICE_INTERNAL_TOKEN: ${USER_SERVICE_INTERNAL_TOKEN}

    depends_on:

      - mongodb

      - redis

    networks:

      - enterprise-network

    volumes:

      - ./services/auth-service:/app

      - ./shared:/shared

      - /app/node_modules

    command: ["sh", "-c", "npm ci || npm install; node /shared/postinstall-link.cjs; node src/server.js"]



  user-service:

    build:
      context: .
      dockerfile: services/user-service/Dockerfile

    container_name: enterprise-user-service

    env_file:

      - .env

      - ./services/user-service/.env

    environment:

      USER_SERVICE_INTERNAL_TOKEN: ${USER_SERVICE_INTERNAL_TOKEN}

    depends_on:

      - mongodb

      - redis

    networks:

      - enterprise-network

    volumes:

      - ./services/user-service:/app

      - ./shared:/shared

      - /app/node_modules

    command: ["sh", "-c", "npm ci || npm install; node /shared/postinstall-link.cjs; node src/server.js"]



  organization-service:

