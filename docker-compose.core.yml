      - redis

      - organization-service

    networks:

      - enterprise-network

    volumes:

      - ./services/role-permission-service:/app

      - ./shared:/shared

      - /app/node_modules

    command: ["sh", "-c", "npm ci || npm install; node /shared/postinstall-link.cjs; node src/server.js"]



  chat-service:

    build:
      context: .
      dockerfile: services/chat-service/Dockerfile

    container_name: enterprise-chat-service

    env_file:

      - .env

      - ./services/chat-service/.env

    environment:

      CHAT_INTERNAL_TOKEN: ${CHAT_INTERNAL_TOKEN}

      RABBITMQ_URL: ${RABBITMQ_URL}

      FRIEND_DM_USE_QUEUE: ${FRIEND_DM_USE_QUEUE}

      REALTIME_INTERNAL_TOKEN: ${REALTIME_INTERNAL_TOKEN}

      NOTIFICATION_INTERNAL_TOKEN: ${NOTIFICATION_INTERNAL_TOKEN}

      USER_SERVICE_INTERNAL_TOKEN: ${USER_SERVICE_INTERNAL_TOKEN}

    depends_on:

      mongodb:

        condition: service_started

      redis:

        condition: service_started

      rabbitmq:

        condition: service_healthy

      meilisearch:

        condition: service_started

      user-service:

        condition: service_started

      organization-service:

        condition: service_started

    networks:

      - enterprise-network

    volumes:

      - ./services/chat-service:/app

      - ./shared:/shared

      - /app/node_modules

    command: ["sh", "-c", "npm ci || npm install; node /shared/postinstall-link.cjs; node src/server.js"]



  task-service:

    build:
      context: .
      dockerfile: services/task-service/Dockerfile

    container_name: enterprise-task-service

    env_file:

      - .env

      - ./services/task-service/.env

    environment:

      RABBITMQ_URL: ${RABBITMQ_URL}

      CHAT_INTERNAL_TOKEN: ${CHAT_INTERNAL_TOKEN}

    depends_on:

      mongodb:

        condition: service_started

      redis:

        condition: service_started

      rabbitmq:

        condition: service_healthy

      chat-service:

        condition: service_started

      organization-service:

        condition: service_started

