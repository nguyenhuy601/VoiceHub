    volumes:

      - ./services/webhook-service:/app



  socket-service:

    build:
      context: .
      dockerfile: services/socket-service/Dockerfile

    container_name: enterprise-socket-service

    expose:

      - "3017"

    env_file:

      - .env

      - ./services/socket-service/.env

    environment:

      USER_SERVICE_INTERNAL_TOKEN: ${USER_SERVICE_INTERNAL_TOKEN}

      REDIS_HOST: ${REDIS_HOST}

      REDIS_PORT: ${REDIS_PORT}

      RABBITMQ_URL: ${RABBITMQ_URL}

      FRIEND_DM_USE_QUEUE: ${FRIEND_DM_USE_QUEUE}

      REALTIME_INTERNAL_TOKEN: ${REALTIME_INTERNAL_TOKEN}

      SOCKET_IO_REDIS_ADAPTER: ${SOCKET_IO_REDIS_ADAPTER:-true}

    depends_on:

      redis:

        condition: service_started

      rabbitmq:

        condition: service_healthy

      chat-service:

        condition: service_started

      auth-service:

        condition: service_started

      user-service:

        condition: service_started

    networks:

      - enterprise-network

    volumes:

      - ./services/socket-service:/app

      - ./shared:/shared

      - /app/node_modules

    command: ["sh", "-c", "npm ci || npm install; node /shared/postinstall-link.cjs; node src/server.js"]



networks:

  enterprise-network:

    driver: bridge

