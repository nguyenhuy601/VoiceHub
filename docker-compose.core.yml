  webhook-service:

    build: ./services/webhook-service

    container_name: enterprise-webhook-service

    env_file:

      - .env

      - ./services/webhook-service/.env

    environment:

      NOTIFICATION_INTERNAL_TOKEN: ${NOTIFICATION_INTERNAL_TOKEN}

    depends_on:

      - notification-service

    networks:

