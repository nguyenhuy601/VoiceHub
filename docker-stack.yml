      SOCKET_SERVICE_URL: ${SOCKET_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://voicehub.local}
      VOICE_SIGNAL_PATH: /voice-socket
      MEDIASOUP_LISTEN_IP: ${MEDIASOUP_LISTEN_IP:-0.0.0.0}
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP}
      MEDIASOUP_PREFER_TCP: ${MEDIASOUP_PREFER_TCP:-true}
      MEDIASOUP_LOG_LEVEL: ${MEDIASOUP_LOG_LEVEL:-warn}
      MEDIASOUP_INITIAL_OUTGOING_BITRATE: ${MEDIASOUP_INITIAL_OUTGOING_BITRATE:-1000000}
      MEDIASOUP_IN_DOCKER: ${MEDIASOUP_IN_DOCKER:-true}
      RTC_MIN_PORT: ${RTC_MIN_PORT:-40000}
      RTC_MAX_PORT: ${RTC_MAX_PORT:-40065}
      REALTIME_INTERNAL_TOKEN: ${REALTIME_INTERNAL_TOKEN}
      CHAT_INTERNAL_TOKEN: ${CHAT_INTERNAL_TOKEN}
      USER_SERVICE_INTERNAL_TOKEN: ${USER_SERVICE_INTERNAL_TOKEN}
      NOTIFICATION_INTERNAL_TOKEN: ${NOTIFICATION_INTERNAL_TOKEN}
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN}
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_QUORUM_QUEUES: ${RABBITMQ_QUORUM_QUEUES:-true}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_REGION: ${MINIO_REGION}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      VOICE_MEETING_MIN_PERSIST_SEC: ${VOICE_MEETING_MIN_PERSIST_SEC:-60}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    networks:
      - enterprise-network
    deploy:
      replicas: ${VOICE_SERVICE_REPLICAS:-1}
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.voice == true
      resources:
        limits:
          cpus: "1.50"
          memory: 384M
        reservations:
          cpus: "0.50"
          memory: 128M

  notification-service:
    image: ${NOTIFICATION_SERVICE_IMAGE}
    env_file:
      - .env
      - ./services/notification-service/.env
    environment:
      - NOTIFICATION_INTERNAL_TOKEN=${NOTIFICATION_INTERNAL_TOKEN}
      - NOTIFICATION_ASYNC_DISPATCH=${NOTIFICATION_ASYNC_DISPATCH:-false}
      - NOTIFICATION_DISPATCH_WORKER=false
    networks:
      - enterprise-network
    deploy:
      replicas: ${NOTIFICATION_SERVICE_REPLICAS:-1}
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 80M

  notification-dispatch-worker:
    image: ${NOTIFICATION_SERVICE_IMAGE}
    command: ["node", "src/worker.js"]
    env_file:
      - .env
      - ./services/notification-service/.env
    environment:
      - NOTIFICATION_INTERNAL_TOKEN=${NOTIFICATION_INTERNAL_TOKEN}
      - NOTIFICATION_ASYNC_DISPATCH=true
      - NOTIFICATION_DISPATCH_WORKER=true
      - RABBITMQ_URL=${RABBITMQ_URL}
    networks:
      - enterprise-network
    deploy:
      replicas: ${NOTIFICATION_DISPATCH_WORKER_REPLICAS:-1}
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      resources:
        limits:
          cpus: "0.75"
          memory: 320M
        reservations:
          cpus: "0.20"
          memory: 96M

  # Host Nginx → :3017 vào đây (sticky). socket-service chỉ overlay; S2S dùng DNS VIP.
  socket-edge:
    image: haproxy:2.9.14-alpine
    configs:
      - source: socket_edge_haproxy
        target: /usr/local/etc/haproxy/haproxy.cfg
    ports:
      - target: 3017
        published: 3017
        protocol: tcp
        mode: ingress
    networks:
      - enterprise-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 32M

  socket-service:
    image: ${SOCKET_SERVICE_IMAGE}
    # Không publish host — host Nginx qua socket-edge :3017 (sticky sid / X-Real-IP).
    # Overlay: socket-service:3017 (VIP S2S) và tasks.socket-service (edge template).
    expose:
      - "3017"
    env_file:
      - .env
      - ./services/socket-service/.env
    environment:
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - USER_SERVICE_INTERNAL_TOKEN=${USER_SERVICE_INTERNAL_TOKEN}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_URL=${REDIS_URL:-}
      - REDIS_SENTINELS=${REDIS_SENTINELS:-}
      - REDIS_SENTINEL_NAME=${REDIS_SENTINEL_NAME:-mymaster}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_USE_AUTH=${REDIS_USE_AUTH:-false}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - FRIEND_DM_USE_QUEUE=${FRIEND_DM_USE_QUEUE}
      - REALTIME_INTERNAL_TOKEN=${REALTIME_INTERNAL_TOKEN}
      - SOCKET_IO_REDIS_ADAPTER=${SOCKET_IO_REDIS_ADAPTER:-true}
    networks:
      - enterprise-network
    deploy:
      # Scale >=2 cần SOCKET_IO_REDIS_ADAPTER=true + socket-edge sticky (host :3017).
      replicas: ${SOCKET_SERVICE_REPLICAS:-1}
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      resources:
        limits:
          cpus: "0.75"
          memory: 320M
        reservations:
          cpus: "0.20"
          memory: 96M

  # --- Infra / AI (trước đây Compose extra) — DNS: ollama, minio, qdrant ---
  # Ollama local — mặc định tắt (OLLAMA_REPLICAS=0). Bật lại: OLLAMA_REPLICAS=1 + OLLAMA_BASE_URL.
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - enterprise-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 45s
    deploy:
      replicas: ${OLLAMA_REPLICAS:-0}
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "4.00"
          memory: 3072M
        reservations:
          cpus: "1.00"
          memory: 1024M
      placement:
        constraints:
          - node.labels.ai == true

  qdrant:
    image: qdrant/qdrant:v1.13.2
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - enterprise-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  # Docker Hub minio/* community images removed (2025-10); use Quay mirrors.
  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - enterprise-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  minio-init:
    image: quay.io/minio/mc:latest
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-meeting-recordings}
    entrypoint:
      - /bin/sh
      - -c
      - |
        for i in $$(seq 1 40); do
          mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" && break
          sleep 2
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        exit 0
    networks:
      - enterprise-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 15

configs:
  socket_edge_haproxy:
    file: ./devops/swarm/socket-edge-haproxy.cfg

networks:
  enterprise-network:
    driver: overlay
    attachable: true

volumes:
  user_service_uploads:
  # Reuse Compose-extra volume names so existing models/objects survive cutover.
  ollama_data:
    external: true
    name: voicehub-extra_ollama_data
  minio_data:
    external: true
    name: voicehub-extra_minio_data
  qdrant_data:
    external: true
    name: voicehub-extra_qdrant_data
