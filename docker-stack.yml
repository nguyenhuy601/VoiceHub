services:
  api-gateway:
    image: ${API_GATEWAY_IMAGE}
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: ingress
    env_file:
      - .env
      - ./api-gateway/.env
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_URL=${REDIS_URL:-}
      - REDIS_SENTINELS=${REDIS_SENTINELS:-}
      - REDIS_SENTINEL_NAME=${REDIS_SENTINEL_NAME:-mymaster}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_USE_AUTH=${REDIS_USE_AUTH:-false}
      - PROJECT_SERVICE_URL=http://project-service:3009
    networks:
      - enterprise-network
    deploy:
      replicas: ${API_GATEWAY_REPLICAS:-1}
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first
      resources:
        limits:
          cpus: "0.75"
          memory: 320M
        reservations:
          cpus: "0.15"
          memory: 80M

  auth-service:
    image: ${AUTH_SERVICE_IMAGE}
    env_file:
      - .env
      - ./services/auth-service/.env
    environment:
      - USER_SERVICE_INTERNAL_TOKEN=${USER_SERVICE_INTERNAL_TOKEN}
    networks:
      - enterprise-network
    deploy:
      replicas: ${AUTH_SERVICE_REPLICAS:-1}
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 80M

  user-service:
    image: ${USER_SERVICE_IMAGE}
    env_file:
      - .env
      - ./services/user-service/.env
    environment:
      - USER_SERVICE_INTERNAL_TOKEN=${USER_SERVICE_INTERNAL_TOKEN}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - MINIO_REGION=${MINIO_REGION}
      - MINIO_USE_SSL=${MINIO_USE_SSL}
    volumes:
      # Persist avatar uploads across service recreate (tránh DB có path nhưng file mất).
      - user_service_uploads:/app/uploads
    networks:
      - enterprise-network
    deploy:
      replicas: ${USER_SERVICE_REPLICAS:-1}
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 80M

  organization-service:
    image: ${ORGANIZATION_SERVICE_IMAGE}
    env_file:
      - .env
      - ./services/organization-service/.env
    environment:
      - NOTIFICATION_INTERNAL_TOKEN=${NOTIFICATION_INTERNAL_TOKEN}
      - NOTIFICATION_SERVICE_URL=${NOTIFICATION_SERVICE_URL}
      - FRIEND_SERVICE_URL=${FRIEND_SERVICE_URL}
      - GATEWAY_INTERNAL_TOKEN=${GATEWAY_INTERNAL_TOKEN}
      - PROJECT_SERVICE_URL=http://project-service:3009
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - USER_SERVICE_INTERNAL_TOKEN=${USER_SERVICE_INTERNAL_TOKEN}
    networks:
      - enterprise-network
    deploy:
      replicas: ${ORGANIZATION_SERVICE_REPLICAS:-1}
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 80M

  # Graph retired — traffic on ORGANIZATION_SERVICE_URL via FRIEND_SERVICE_URL remap.
  # Keep service definition + friend_db; default replicas 0 until Step 7 delete.
  role-permission-service:
    image: ${ROLE_PERMISSION_SERVICE_IMAGE}
    env_file:
      - .env
      - ./services/role-permission-service/.env
    environment:
      - NOTIFICATION_SERVICE_URL=${NOTIFICATION_SERVICE_URL}
      - NOTIFICATION_INTERNAL_TOKEN=${NOTIFICATION_INTERNAL_TOKEN}
    networks:
      - enterprise-network
    deploy:
      replicas: ${ROLE_PERMISSION_SERVICE_REPLICAS:-1}
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 80M

  chat-service:
    image: ${CHAT_SERVICE_IMAGE}
    env_file:
      - .env
      - ./services/chat-service/.env
    environment:
      - CHAT_INTERNAL_TOKEN=${CHAT_INTERNAL_TOKEN}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - FRIEND_DM_USE_QUEUE=${FRIEND_DM_USE_QUEUE}
      - REALTIME_INTERNAL_TOKEN=${REALTIME_INTERNAL_TOKEN}
      - NOTIFICATION_INTERNAL_TOKEN=${NOTIFICATION_INTERNAL_TOKEN}
      - NOTIFICATION_SERVICE_URL=${NOTIFICATION_SERVICE_URL}
      - ORGANIZATION_SERVICE_URL=${ORGANIZATION_SERVICE_URL}
      - CHAT_UPLOAD_STORAGE=${CHAT_UPLOAD_STORAGE:-auto}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - MINIO_REGION=${MINIO_REGION}
      - MINIO_USE_SSL=${MINIO_USE_SSL}
    networks:
      - enterprise-network
    deploy:
      replicas: ${CHAT_SERVICE_REPLICAS:-1}
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
      resources:
        limits:
          cpus: "0.75"
          memory: 384M
        reservations:
          cpus: "0.20"
          memory: 96M

  project-service:
    image: ${PROJECT_SERVICE_IMAGE}
    env_file:
      - .env
      - ./services/project-service/.env
    environment:
      - RABBITMQ_URL=${RABBITMQ_URL}
      - CHAT_SERVICE_URL=${CHAT_SERVICE_URL}
      - CHAT_INTERNAL_TOKEN=${CHAT_INTERNAL_TOKEN}
      - TASK_FROM_FILE_WORKER=false
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.8-max}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - LLM_CHAT_MODEL=${LLM_CHAT_MODEL:-}
    networks:
      - enterprise-network
    deploy:
      replicas: ${PROJECT_SERVICE_REPLICAS:-1}
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.75"
          memory: 384M
        reservations:
          cpus: "0.20"
          memory: 96M

  project-worker:
    image: ${PROJECT_SERVICE_IMAGE}
    command: ["node", "src/worker.js"]
    env_file:
      - .env
      - ./services/project-service/.env
    environment:
      - RABBITMQ_URL=${RABBITMQ_URL}
      - CHAT_SERVICE_URL=${CHAT_SERVICE_URL}
      - CHAT_INTERNAL_TOKEN=${CHAT_INTERNAL_TOKEN}
      - TASK_FROM_FILE_WORKER=true
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.8-max}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - LLM_CHAT_MODEL=${LLM_CHAT_MODEL:-}
    networks:
      - enterprise-network
    deploy:
      replicas: ${TASK_WORKER_REPLICAS:-1}
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      resources:
        limits:
          cpus: "0.75"
          memory: 384M
        reservations:
          cpus: "0.20"
          memory: 96M

  ai-project-planning-service:
    image: ${AI_PROJECT_PLANNING_SERVICE_IMAGE}
    env_file:
      - .env
      - ./services/ai-project-planning-service/.env
    environment:
      # LangGraph WHAT + FR pack (~65) needs >512M; OOM → exit 139 mid-run
      - NODE_OPTIONS=--max-old-space-size=1280
      - PROJECT_SERVICE_URL=http://project-service:3009
      - GATEWAY_INTERNAL_TOKEN=${GATEWAY_INTERNAL_TOKEN}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai_compatible}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - LLM_CHAT_MODEL=${LLM_CHAT_MODEL:-}
      # DashScope free embed when LLM_PROVIDER=openai_compatible|dashscope; Ollama tags ignored in code
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-text-embedding-v4}
      - RAG_EMBEDDING_VERSION=${RAG_EMBEDDING_VERSION:-dashscope-text-embedding-v4}
      - RAG_EMBED_DIMENSIONS=${RAG_EMBED_DIMENSIONS:-1024}
      - RAG_MODE=${RAG_MODE:-hybrid}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-vh_ai_plan_g7}
      # In-run HITL only (clarify/edit_draft). Gate 1/2 stay HTTP on project-service.
      # Requires Redis+RedisJSON when =1 — MemorySaver fail-fast (no Postgres).
      - AGENT_CORE_HITL_INTERRUPT=${AGENT_CORE_HITL_INTERRUPT:-0}
      - JEV_CONTROL=${JEV_CONTROL:-0}
      # 0 = try RedisSaver (RedisJSON); 1 = force MemorySaver (incompatible with HITL interrupt=1)
      - AGENT_CORE_LG_MEMORY=${AGENT_CORE_LG_MEMORY:-0}
      # HOW semantic LLM (Arch/Dep/Risk/Quality/WBS) — DashScope via generateJson
      - HOW_SEMANTIC_LLM=${HOW_SEMANTIC_LLM:-1}
      - HOW_ARCH_LLM=${HOW_ARCH_LLM:-1}
      - HOW_DEP_LLM=${HOW_DEP_LLM:-1}
      - HOW_RISK_LLM=${HOW_RISK_LLM:-1}
      - HOW_QUALITY_LLM=${HOW_QUALITY_LLM:-1}
      - HOW_SEC_TOOL_LLM_SPRINT=${HOW_SEC_TOOL_LLM_SPRINT:-1}
      - HOW_WBS_LLM=${HOW_WBS_LLM:-1}
      - HOW_WBS_LLM_QUEUE=${HOW_WBS_LLM_QUEUE:-0}
      - HOW_WBS_CHUNK_ORCHESTRATOR=${HOW_WBS_CHUNK_ORCHESTRATOR:-1}
      - ARTIFACT_STORE=${ARTIFACT_STORE:-0}
      - HOW_WBS_CHUNK_TRANSPORT=${HOW_WBS_CHUNK_TRANSPORT:-memory}
      - HOW_WBS_CHUNK_CONCURRENCY=${HOW_WBS_CHUNK_CONCURRENCY:-2}
      - HOW_WBS_CHUNK_MEMORY=${HOW_WBS_CHUNK_MEMORY:-0}
      - HOW_WBS_CHUNK_MAX_ATTEMPTS=${HOW_WBS_CHUNK_MAX_ATTEMPTS:-3}
      - HOW_WBS_LLM_TIMEOUT_MS=${HOW_WBS_LLM_TIMEOUT_MS:-240000}
      - HOW_WBS_LLM_MAX_LEAVES_PER_FR=${HOW_WBS_LLM_MAX_LEAVES_PER_FR:-4}
      - HOW_WBS_LLM_MAX_CHUNKS=${HOW_WBS_LLM_MAX_CHUNKS:-16}
      - HOW_WBS_LLM_CACHE=${HOW_WBS_LLM_CACHE:-1}
      - HOW_WBS_LLM_CACHE_TTL_SEC=${HOW_WBS_LLM_CACHE_TTL_SEC:-604800}
      - HOW_WBS_TOOL_TIMEOUT_MS=${HOW_WBS_TOOL_TIMEOUT_MS:-900000}
      - HOW_SCHEDULE_TOOL_TIMEOUT_MS=${HOW_SCHEDULE_TOOL_TIMEOUT_MS:-600000}
      - SPRINT_LLM_TIMEOUT_MS=${SPRINT_LLM_TIMEOUT_MS:-180000}
      - SPRINT_LLM_DEADLINE_MS=${SPRINT_LLM_DEADLINE_MS:-600000}
      - HOW_WBS_LLM_JOB_TIMEOUT_MS=${HOW_WBS_LLM_JOB_TIMEOUT_MS:-1800000}
      - HOW_WBS_LLM_JOB_STALE_MS=${HOW_WBS_LLM_JOB_STALE_MS:-1900000}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - RABBITMQ_WBS_LLM_QUEUE=${RABBITMQ_WBS_LLM_QUEUE:-ai.planning.wbs_llm}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_URL=${REDIS_URL:-}
      # Optional Redis Stack (RedisJSON) for LangGraph checkpointer — see devops/swarm/redis-stack-lg/
      - LG_REDIS_URL=${LG_REDIS_URL:-}
      - REDIS_SENTINELS=${REDIS_SENTINELS:-}
      - REDIS_SENTINEL_NAME=${REDIS_SENTINEL_NAME:-mymaster}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_USE_AUTH=${REDIS_USE_AUTH:-false}
    networks:
      - enterprise-network
    deploy:
      replicas: ${AI_PROJECT_PLANNING_SERVICE_REPLICAS:-1}
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 256M

  # WBS chunks: ai-project-planning-llm-jobs-worker (LLM_JOBS_WBS=1 → ai.planning.llm_jobs).
  # Legacy wbsChunk.worker / ai.planning.wbs_chunk removed from Swarm.

  ai-project-planning-llm-jobs-worker:
    image: ${AI_PROJECT_PLANNING_SERVICE_IMAGE}
    command: ["node", "src/workers/llmJobs.worker.js"]
    env_file:
      - .env
      - ./services/ai-project-planning-service/.env
    environment:
      - WORKER_ROLE=llm_jobs
      - LLM_JOBS_ENABLED=${LLM_JOBS_ENABLED:-0}
      - LLM_JOBS_INLINE=0
      - LLM_JOBS_TRANSPORT=rabbit
      - LLM_JOBS_MEMORY=0
      - LLM_JOBS_WBS=${LLM_JOBS_WBS:-1}
      - LLM_JOBS_TYPES=${LLM_JOBS_TYPES:-*}
      - LLM_JOBS_QUEUE=${LLM_JOBS_QUEUE:-ai.planning.llm_jobs}
      - LLM_JOBS_DLQ=${LLM_JOBS_DLQ:-ai.planning.llm_jobs.dlq}
      - LLM_JOBS_PREFETCH=${LLM_JOBS_PREFETCH:-1}
      - ARTIFACT_STORE=${ARTIFACT_STORE:-0}
      - AI_PLANNING_LLM=${AI_PLANNING_LLM:-1}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai_compatible}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - LLM_CHAT_MODEL=${LLM_CHAT_MODEL:-}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - RABBITMQ_QUORUM_QUEUES=${RABBITMQ_QUORUM_QUEUES:-true}
    networks:
      - enterprise-network
    deploy:
      replicas: ${AI_PROJECT_PLANNING_LLM_JOBS_WORKER_REPLICAS:-0}
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # Documents retired into organization-service — traffic via DOCUMENT_SERVICE_URL remap.
  # Keep service definition + document_db; default replicas 0 until folder delete approval.
  voice-service:
    image: ${VOICE_SERVICE_IMAGE}
