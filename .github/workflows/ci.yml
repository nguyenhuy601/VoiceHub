# CI — Continuous Integration (VoiceHub)
# branch push / PR→main: Lint → Test → Scan(fs) → Build (push=false) → ci-gate
# main push:             Lint → Test → Scan(fs) → Build+Push → Scan(image) → Manifest → ci-gate
# Không dual CI / không release.yml — publish chỉ trên main trong workflow này.
# CD không rebuild (xem cd.yml); CD chỉ lắng nghe CI trên main.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    # Mọi feature branch + main — push NhatHuy cũng chạy CI (verify, không publish).
    branches:
      - "**"
    tags-ignore:
      - "**"
  workflow_dispatch:
    inputs:
      publish:
        description: "On main-like run: publish images + release manifest"
        type: boolean
        default: false
      force_all_images:
        description: "Force build/publish all Swarm app images"
        type: boolean
        default: false

concurrency:
  # Cùng nhánh: PR synchronize + push dùng chung group (tránh 2 run song song).
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  pull-requests: read
  security-events: write
  actions: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      client: ${{ steps.filter.outputs.client }}
      api_gateway: ${{ steps.filter.outputs.api_gateway }}
      services: ${{ steps.filter.outputs.services }}
      docker: ${{ steps.filter.outputs.docker }}
      is_main_publish: ${{ steps.meta.outputs.is_main_publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'shared/**'
            client:
              - 'client/**'
            api_gateway:
              - 'api-gateway/**'
            services:
              - 'services/**'
            docker:
              - 'api-gateway/Dockerfile'
              - 'services/*/Dockerfile'
              - '.github/swarm-app-images.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cd.yml'
              - 'devops/scripts/**'
      - id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PUBLISH_INPUT: ${{ github.event.inputs.publish || 'false' }}
        run: |
          set -euo pipefail
          IS_MAIN_PUBLISH=false
          if [[ "${EVENT}" == "push" && "${REF}" == "refs/heads/main" ]]; then
            IS_MAIN_PUBLISH=true
          elif [[ "${EVENT}" == "workflow_dispatch" && "${PUBLISH_INPUT}" == "true" && "${REF}" == "refs/heads/main" ]]; then
            IS_MAIN_PUBLISH=true
          fi
          echo "is_main_publish=${IS_MAIN_PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "is_main_publish=${IS_MAIN_PUBLISH}"

  # ── Scan ──────────────────────────────────────────────
  # TEMP: bỏ check env/secrets (gitleaks + check-security-env) khi repo chưa public.
  # Bật lại trước khi open-source / public: xóa `if: false` ở 2 step dưới.
  scan:
    name: "Scan — fs (env/secrets tạm tắt)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Security env (ci profile)
        if: false
        run: VOICEHUB_ENV_CHECK=ci bash devops/scripts/security/check-security-env.sh

      - name: Gitleaks
        if: false
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # v0.28.0 pulls setup-trivy@v0.2.1 (tag yanked after supply-chain incident).
      # v0.36.0 pins setup-trivy by SHA.
      - name: Trivy filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          skip-dirs: node_modules,.git,client/dist,**/node_modules

  # ── Lint ──────────────────────────────────────────────
  lint-client:
    name: "Lint — client"
    needs: changes
    if: needs.changes.outputs.client == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - working-directory: client
        run: npm ci
      - name: ESLint
        working-directory: client
        run: npm run lint
      - name: Vite build
        working-directory: client
        env:
          VITE_API_URL: /api
        run: npm run build

  # ── Test ──────────────────────────────────────────────
  test-shared:
    name: "Test — shared"
    needs: changes
    if: needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: shared/package-lock.json
      - working-directory: shared
        run: npm ci --ignore-scripts
      - run: node --test shared/tests/*.test.js

  test-api-gateway:
    name: "Test — api-gateway"
    needs: changes
    if: >-
      needs.changes.outputs.api_gateway == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            api-gateway/package-lock.json
            shared/package-lock.json
      - run: |
          (cd shared && npm ci --ignore-scripts)
          (cd api-gateway && npm ci --ignore-scripts)
          (cd api-gateway && node ../shared/postinstall-link.cjs)
      - working-directory: api-gateway
        run: |
          if compgen -G "tests/*.test.js" > /dev/null; then
            node --test tests/*.test.js
          fi
          if compgen -G "src/swagger/*.test.js" > /dev/null; then
            node --test src/swagger/*.test.js
          fi

  test-services:
    name: "Test — changed services"
    needs: changes
    if: needs.changes.outputs.services == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: shared
        run: npm ci --ignore-scripts
      - name: Detect & test service packages
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCE_SWARM_APP: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          mapfile -t SWARM_APP < <(node -e 'require("./.github/swarm-app-images.json").forEach(x=>{if(x.image!=="api-gateway")console.log(x.image)})')
          TARGETS=()
          if [[ "${FORCE_SWARM_APP}" == "true" ]]; then
            TARGETS=("${SWARM_APP[@]}")
          else
            BEFORE="${BASE_REF:-}"
            if [[ -z "${BEFORE}" || "${BEFORE}" =~ ^0+$ ]]; then
              BEFORE="$(git rev-parse HEAD~1 2>/dev/null || true)"
            fi
            if [[ -n "${BEFORE}" ]] && git rev-parse --verify "${BEFORE}" >/dev/null 2>&1; then
              mapfile -t CHANGED < <(git diff --name-only "${BEFORE}"...HEAD -- 'services/' | awk -F/ 'NF>=2 {print $2}' | sort -u)
            else
              CHANGED=("${SWARM_APP[@]}")
            fi
            for c in "${CHANGED[@]}"; do
              for s in "${SWARM_APP[@]}"; do
                [[ "$c" == "$s" ]] && TARGETS+=("$c")
              done
            done
          fi
          echo "Service targets: ${TARGETS[*]:-none}"
          for svc in "${TARGETS[@]}"; do
            dir="services/${svc}"
            [[ -d "${dir}" && -f "${dir}/package.json" ]] || continue
            shopt -s nullglob
            tests=("${dir}/tests"/*.test.js)
            shopt -u nullglob
            [[ ${#tests[@]} -eq 0 ]] && { echo "==> skip ${svc}"; continue; }
            echo "==> test ${svc}"
            if [[ -f "${dir}/package-lock.json" ]]; then
              (cd "${dir}" && npm ci --ignore-scripts)
            else
              (cd "${dir}" && npm install --ignore-scripts)
            fi
            (cd "${dir}" && node ../../shared/postinstall-link.cjs)
            (cd "${dir}" && node --test tests/*.test.js)
          done

  # ── Docker matrix (shared script) ─────────────────────
  resolve-docker-matrix:
    name: "Docker — resolve matrix"
    needs: changes
    if: >-
      (
        (
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && needs.changes.outputs.is_main_publish != 'true')
        ) && (
          needs.changes.outputs.docker == 'true' ||
          needs.changes.outputs.shared == 'true' ||
          needs.changes.outputs.api_gateway == 'true' ||
          needs.changes.outputs.services == 'true'
        )
      ) || (
        needs.changes.outputs.is_main_publish == 'true' && (
          needs.changes.outputs.docker == 'true' ||
          needs.changes.outputs.shared == 'true' ||
          needs.changes.outputs.api_gateway == 'true' ||
          needs.changes.outputs.services == 'true' ||
          github.event.inputs.force_all_images == 'true' ||
          github.event_name == 'workflow_dispatch'
        )
      )
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      has_images: ${{ steps.set.outputs.has_images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Script uses node heredoc — runner may not expose `node` on PATH (exit 127).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - id: set
        env:
          IS_MAIN: ${{ needs.changes.outputs.is_main_publish }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_ALL_INPUT: ${{ github.event.inputs.force_all_images || 'false' }}
          SHARED_CHANGED: ${{ needs.changes.outputs.shared }}
          DOCKER_CHANGED: ${{ needs.changes.outputs.docker }}
          PR_BASE: ${{ github.event.pull_request.base.sha || '' }}
          BEFORE: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          EVENT_ARG=pr
          BASE="${PR_BASE}"
          if [[ "${IS_MAIN}" == "true" ]]; then
            EVENT_ARG=push
            BASE="${BEFORE}"
            if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]]; then
              BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
            fi
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            # Feature-branch push: path-filter vs previous commit (giống PR verify).
            BASE="${BEFORE}"
            if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]]; then
              BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
            fi
          fi
          EXTRA=()
          if [[ "${FORCE_ALL_INPUT}" == "true" || "${SHARED_CHANGED}" == "true" || "${DOCKER_CHANGED}" == "true" ]]; then
            EXTRA+=(--force-all)
          fi
          ARGS=(--event "${EVENT_ARG}" --head HEAD --github-output)
          [[ -n "${BASE}" ]] && ARGS+=(--base "${BASE}")
          ARGS+=("${EXTRA[@]}")
          bash devops/scripts/docker/resolve-docker-matrix.sh "${ARGS[@]}"

  # ── PR / feature-branch push: build verify (push=false) ─
  build-docker:
    name: "Build — ${{ matrix.image }} (no push)"
    needs: [changes, resolve-docker-matrix]
    if: >-
      (
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && needs.changes.outputs.is_main_publish != 'true')
      ) &&
      needs.resolve-docker-matrix.outputs.has_images == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-docker-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: voicehub-${{ matrix.image }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=ci-${{ matrix.image }}

  # ── Main only: build once + push (no second verify build) ─
  publish-docker:
    name: "Publish — ${{ matrix.image }}"
    needs: [changes, resolve-docker-matrix, scan, lint-client, test-shared, test-api-gateway, test-services]
    if: >-
      always() &&
      needs.changes.outputs.is_main_publish == 'true' &&
      needs.resolve-docker-matrix.result == 'success' &&
      needs.resolve-docker-matrix.outputs.has_images == 'true' &&
      needs.scan.result != 'failure' && needs.scan.result != 'cancelled' &&
      (needs.lint-client.result == 'success' || needs.lint-client.result == 'skipped') &&
      (needs.test-shared.result == 'success' || needs.test-shared.result == 'skipped') &&
      (needs.test-api-gateway.result == 'success' || needs.test-api-gateway.result == 'skipped') &&
      (needs.test-services.result == 'success' || needs.test-services.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-docker-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push (one shot)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/voicehub/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/voicehub/${{ matrix.image }}:latest
          cache-from: type=gha,scope=ci-${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=ci-${{ matrix.image }}
      - name: Resolve digest
        env:
          IMAGE: ${{ matrix.image }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REF="ghcr.io/${OWNER}/voicehub/${IMAGE}:${SHA}"
          DIGEST="$(docker buildx imagetools inspect "${REF}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          if [[ -z "${DIGEST}" || "${DIGEST}" != sha256:* ]]; then
            DIGEST="$(docker buildx imagetools inspect "${REF}" | awk '/Digest:/ {print $2; exit}')"
          fi
          [[ -n "${DIGEST}" && "${DIGEST}" == sha256:* ]] || { echo "Failed digest for ${REF}"; exit 1; }
          mkdir -p digests
          printf '%s' "${DIGEST}" > "digests/${IMAGE}.txt"
          echo "digest=${DIGEST}"
      - name: Trivy image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/voicehub/${{ matrix.image }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}
          path: digests/${{ matrix.image }}.txt
          if-no-files-found: error
          retention-days: 30

  release-manifest:
    name: "Release — manifest"
    needs: [changes, resolve-docker-matrix, publish-docker]
    if: >-
      always() &&
      needs.changes.outputs.is_main_publish == 'true' &&
      (needs.resolve-docker-matrix.result == 'success' || needs.resolve-docker-matrix.result == 'skipped') &&
      (needs.publish-docker.result == 'success' || needs.publish-docker.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.gen.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download built digests
        if: needs.publish-docker.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests-in
          merge-multiple: true
      - name: Build built.json from digests
        id: built
        env:
          PUBLISH_RESULT: ${{ needs.publish-docker.result }}
        run: |
          set -euo pipefail
          mkdir -p digests-in
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dir = 'digests-in';
          const built = {};
          if (fs.existsSync(dir)) {
            for (const f of fs.readdirSync(dir)) {
              if (!f.endsWith('.txt')) continue;
              const name = f.replace(/\.txt$/, '');
              built[name] = fs.readFileSync(path.join(dir, f), 'utf8').trim();
            }
          }
          fs.writeFileSync('built.json', JSON.stringify(built, null, 2));
          console.log('built services:', Object.keys(built).join(', ') || '(none)');
          NODE
      - name: Generate manifest
        id: gen
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DAY="$(date -u +%Y%m%d)"
          RELEASE_ID="R${DAY}-${RUN_NUMBER}"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

          mkdir -p prev-manifest
          PREV_TAG="$(gh release list --limit 20 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft==false) | .tagName] | map(select(startswith("voicehub-R"))) | .[0] // empty' 2>/dev/null || true)"
          EXTRA=()
          if [[ -n "${PREV_TAG}" ]]; then
            echo "Previous release tag: ${PREV_TAG}"
            if gh release download "${PREV_TAG}" --pattern release-manifest.json --dir prev-manifest 2>/dev/null; then
              EXTRA+=(--previous prev-manifest/release-manifest.json)
            fi
          else
            echo "No previous voicehub-R* release found"
          fi

          node devops/scripts/release/generate-release-manifest.mjs \
            --commit "${SHA}" \
            --release-id "${RELEASE_ID}" \
            --owner "${OWNER}" \
            --built built.json \
            "${EXTRA[@]}" \
            --out release-manifest.json
          # Minimal schema checks without ajv
          node <<'NODE'
          const fs = require('fs');
          const catalog = require('./.github/swarm-app-images.json');
          const m = JSON.parse(fs.readFileSync('release-manifest.json', 'utf8'));
          const keys = Object.keys(m.services || {});
          if (keys.length !== catalog.length) {
            console.error(`Expected ${catalog.length} services, got ${keys.length}`);
            process.exit(1);
          }
          for (const row of catalog) {
            const s = m.services[row.image];
            if (!s?.repository || !s?.tag || !s?.digest?.includes('@sha256:')) {
              console.error(`Invalid entry for ${row.image}`, s);
              process.exit(1);
            }
          }
          if (!/^R[0-9]{8}-[0-9]+$/.test(m.releaseId)) {
            console.error('Bad releaseId', m.releaseId);
            process.exit(1);
          }
          console.log('Manifest OK', m.releaseId, keys.length);
          NODE
          {
            echo "## Release ${RELEASE_ID}"
            echo ""
            echo "| Service | Digest |"
            echo "|---------|--------|"
            node -e 'const m=require("./release-manifest.json"); for (const [k,v] of Object.entries(m.services).sort()) console.log(`| ${k} | \\`${v.digest.split("@").pop()}\\` |`)'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.gen.outputs.release_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="voicehub-${RELEASE_ID}"
          TITLE="VoiceHub ${RELEASE_ID}"
          BODY="Immutable release for commit \`${SHA}\`.

          Deploy: \`bash devops/swarm/deploy-release.sh --release-id ${RELEASE_ID}\`
          CD promotes this manifest — CD does **not** rebuild images.
          "
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-manifest.json --clobber
          else
            gh release create "${TAG}" release-manifest.json \
              --title "${TITLE}" \
              --notes "${BODY}" \
              --target "${SHA}"
          fi

  # ── Gate ──────────────────────────────────────────────
  ci-gate:
    name: CI gate
    needs:
      - changes
      - scan
      - lint-client
      - test-shared
      - test-api-gateway
      - test-services
      - build-docker
      - publish-docker
      - release-manifest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate Lint | Test | Build | Scan | Publish
        env:
          IS_MAIN: ${{ needs.changes.outputs.is_main_publish }}
        run: |
          set -euo pipefail
          check() {
            local name="$1" result="$2"
            echo "$name=$result"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              exit 1
            fi
          }
          check scan "${{ needs.scan.result }}"
          check lint-client "${{ needs.lint-client.result }}"
          check test-shared "${{ needs.test-shared.result }}"
          check test-api-gateway "${{ needs.test-api-gateway.result }}"
          check test-services "${{ needs.test-services.result }}"
          check build-docker "${{ needs.build-docker.result }}"
          if [[ "${IS_MAIN}" == "true" ]]; then
            check publish-docker "${{ needs.publish-docker.result }}"
            check release-manifest "${{ needs.release-manifest.result }}"
            echo "CI gate PASS (main: Lint | Test | Scan | Publish | Manifest)"
          else
            echo "CI gate PASS (PR: Lint | Test | Build verify | Scan)"
          fi
