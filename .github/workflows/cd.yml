# CD — Continuous Delivery / Deployment (VoiceHub)
# Chuẩn: CI PASS → Artifact (GHCR) → Deploy Dev → Smoke → Staging → Prod
#
# Wave 1: Artifact thật + GitHub Environment gates (approval).
#         Deploy auto cần self-hosted runner (Wave 2) — không SSH vào Docker Desktop LAN từ ubuntu-latest.

name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Git SHA to publish/deploy (empty = current main HEAD)"
        required: false
        default: ""
      image:
        description: "Single image (empty = path-based / all)"
        required: false
        default: ""
      force_all:
        description: "Force build all Swarm app images"
        type: boolean
        default: false
      skip_artifact:
        description: "Skip publish (deploy gates only, use existing :sha)"
        type: boolean
        default: false

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  # ── Chỉ chạy khi CI PASS (hoặc dispatch tay) ───────────
  cd-preflight:
    name: "CD — preflight (CI PASS)"
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      should_run: ${{ steps.meta.outputs.should_run }}
    steps:
      - id: meta
        env:
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          INPUT_SHA: ${{ github.event.inputs.sha || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT}" == "workflow_dispatch" ]]; then
            SHA="${INPUT_SHA:-$HEAD_SHA}"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
            echo "Manual CD for sha=${SHA}"
            exit 0
          fi
          if [[ "${EVENT}" == "workflow_run" && "${CONCLUSION}" == "success" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "sha=${RUN_SHA}" >> "$GITHUB_OUTPUT"
            echo "CI PASS → CD for sha=${RUN_SHA}"
            exit 0
          fi
          echo "should_run=false" >> "$GITHUB_OUTPUT"
          echo "sha=" >> "$GITHUB_OUTPUT"
          echo "Skip CD (event=${EVENT} conclusion=${CONCLUSION})"

  resolve-matrix:
    name: "Artifact — resolve matrix"
    needs: cd-preflight
    if: needs.cd-preflight.outputs.should_run == 'true' && github.event.inputs.skip_artifact != 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      has_images: ${{ steps.set.outputs.has_images }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.cd-preflight.outputs.sha }}
          fetch-depth: 0
      - id: set
        env:
          INPUT_IMAGE: ${{ github.event.inputs.image || '' }}
          FORCE_ALL: ${{ github.event.inputs.force_all || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ needs.cd-preflight.outputs.sha }}
        run: |
          set -euo pipefail
          ALL="$(node -e 'console.log(JSON.stringify(require("./.github/swarm-app-images.json")))')"

          if [[ -n "${INPUT_IMAGE}" ]]; then
            SELECTED="$(echo "$ALL" | jq -c --arg n "$INPUT_IMAGE" '[.[] | select(.image==$n)]')"
            [[ "$(echo "$SELECTED" | jq 'length')" -gt 0 ]] || { echo "Unknown image"; exit 1; }
            echo "matrix=$(echo "$SELECTED" | jq -c '{include:.}')" >> "$GITHUB_OUTPUT"
            echo "has_images=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${FORCE_ALL}" == "true" || "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "matrix=$(echo "$ALL" | jq -c '{include:.}')" >> "$GITHUB_OUTPUT"
            echo "has_images=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # workflow_run: so sánh SHA với parent
          PARENT="$(git rev-parse "${SHA}^" 2>/dev/null || true)"
          BUILD_ALL=false
          if [[ -z "${PARENT}" ]]; then
            BUILD_ALL=true
          elif git diff --name-only "${PARENT}" "${SHA}" -- shared/ .github/swarm-app-images.json .github/workflows/cd.yml | grep -q .; then
            BUILD_ALL=true
          fi

          if [[ "${BUILD_ALL}" == "true" ]]; then
            echo "matrix=$(echo "$ALL" | jq -c '{include:.}')" >> "$GITHUB_OUTPUT"
            echo "has_images=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t CHANGED_PATHS < <(git diff --name-only "${PARENT}" "${SHA}")
          SELECTED='[]'
          while IFS= read -r row; do
            image="$(echo "$row" | jq -r '.image')"
            hit=0
            if [[ "${image}" == "api-gateway" ]]; then
              for p in "${CHANGED_PATHS[@]}"; do [[ "$p" == api-gateway/* ]] && hit=1 && break; done
            else
              for p in "${CHANGED_PATHS[@]}"; do [[ "$p" == "services/${image}/"* ]] && hit=1 && break; done
            fi
            [[ "$hit" -eq 1 ]] && SELECTED="$(echo "$SELECTED" | jq -c --argjson r "$row" '. + [$r]')"
          done < <(echo "$ALL" | jq -c '.[]')

          if [[ "$(echo "$SELECTED" | jq 'length')" -eq 0 ]]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo "has_images=false" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(echo "$SELECTED" | jq -c '{include:.}')" >> "$GITHUB_OUTPUT"
            echo "has_images=true" >> "$GITHUB_OUTPUT"
          fi

  artifact:
    name: "Artifact — push ${{ matrix.image }}"
    needs: [cd-preflight, resolve-matrix]
    if: needs.resolve-matrix.outputs.has_images == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.cd-preflight.outputs.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push (context = repo root)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/voicehub/${{ matrix.image }}:${{ needs.cd-preflight.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/voicehub/${{ matrix.image }}:latest
          cache-from: type=gha,scope=cd-${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=cd-${{ matrix.image }}

  artifact-done:
    name: "Artifact — ready"
    needs: [cd-preflight, resolve-matrix, artifact]
    if: always() && needs.cd-preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ needs.cd-preflight.outputs.sha }}
    steps:
      - name: Confirm artifact stage
        env:
          ARTIFACT_RESULT: ${{ needs.artifact.result }}
          RESOLVE_RESULT: ${{ needs.resolve-matrix.result }}
          SKIP: ${{ github.event.inputs.skip_artifact || 'false' }}
        run: |
          set -euo pipefail
          if [[ "${SKIP}" == "true" ]]; then
            echo "skip_artifact=true — dùng image đã có trên GHCR"
            exit 0
          fi
          if [[ "${RESOLVE_RESULT}" == "failure" || "${ARTIFACT_RESULT}" == "failure" || "${ARTIFACT_RESULT}" == "cancelled" ]]; then
            echo "Artifact stage failed"
            exit 1
          fi
          # skipped resolve (no images) hoặc artifact skipped với has_images=false → vẫn cho CD gates (tag có thể đã tồn tại)
          echo "Artifact stage OK (result=${ARTIFACT_RESULT:-n/a})"

  # ── Deploy Dev → Smoke → Staging → Prod ───────────────
  deploy-development:
    name: "CD Deploy — development"
    needs: [cd-preflight, artifact-done]
    if: needs.cd-preflight.outputs.should_run == 'true' && needs.artifact-done.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://voicehub.local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.cd-preflight.outputs.sha }}
      - name: Wave 1 gate — development
        env:
          SHA: ${{ needs.cd-preflight.outputs.sha }}
          OWNER: ${{ github.repository_owner }}
          CD_ACTIVE: ${{ vars.VOICEHUB_CD_DEV_ACTIVE || 'false' }}
        run: |
          set -euo pipefail
          cat <<EOF
          === CD Deploy development ===
          Artifact: ghcr.io/${OWNER}/voicehub/<service>:${SHA}
          deployed_auto=false (Wave 1)

          Manual (Swarm local — không chạy từ runner này):
            SWARM_USE_LOCAL_IMAGES=1 bash devops/swarm/build-local-images.sh
            SWARM_USE_LOCAL_IMAGES=1 bash devops/swarm/deploy-stack.sh
          Hoặc pull GHCR:
            TAG=${SHA} REGISTRY=ghcr.io OWNER=${OWNER} SWARM_USE_LOCAL_IMAGES=0 bash devops/swarm/deploy-stack.sh

          Wave 2: đăng ký self-hosted runner label voicehub-swarm-dev + VOICEHUB_CD_DEV_ACTIVE=true
          EOF
          if [[ "${CD_ACTIVE}" == "true" ]]; then
            echo "::error::VOICEHUB_CD_DEV_ACTIVE=true nhưng job vẫn chạy trên ubuntu-latest — hãy gắn runs-on self-hosted (Wave 2)."
            exit 1
          fi
          echo "delivery_gate=recorded deployed=false"

  smoke-development:
    name: "CD Smoke — development"
    needs: [cd-preflight, deploy-development]
    if: needs.deploy-development.result == 'success'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.cd-preflight.outputs.sha }}
      - name: Smoke checklist (Wave 1 — manual on LAN)
        env:
          SHA: ${{ needs.cd-preflight.outputs.sha }}
        run: |
          cat <<EOF
          === Smoke development (chạy trên máy Swarm / LAN) ===
          SHA=${SHA}
          1) VOICEHUB_ENV_CHECK=ci bash devops/scripts/check-security-env.sh
          2) node devops/scripts/smoke-single-company.js   # nếu stack + seed sẵn
          3) devops/nginx/verify-lan-https.ps1 -BaseUrl https://voicehub.local
          Wave 2: job này chạy trên self-hosted và fail pipeline nếu smoke fail.
          EOF

  deploy-staging:
    name: "CD Deploy — staging"
    needs: [cd-preflight, artifact-done, smoke-development]
    if: needs.smoke-development.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.cd-preflight.outputs.sha }}
      - name: Wave 1 gate — staging (approval Environment)
        env:
          SHA: ${{ needs.cd-preflight.outputs.sha }}
          OWNER: ${{ github.repository_owner }}
          CD_ACTIVE: ${{ vars.VOICEHUB_CD_STAGING_ACTIVE || 'false' }}
        run: |
          set -euo pipefail
          cat <<EOF
          === CD Deploy staging ===
          Pin tag: ${SHA}   (không dùng :latest cho promote)
          Image: ghcr.io/${OWNER}/voicehub/<service>:${SHA}
          deployed_auto=false (Wave 1)

          Manual trên Swarm staging:
            VOICEHUB_ENV_CHECK=staging bash devops/scripts/check-security-env.sh
            TAG=${SHA} REGISTRY=ghcr.io OWNER=${OWNER} SWARM_USE_LOCAL_IMAGES=0 bash devops/swarm/deploy-stack.sh
            # hoặc: bash devops/swarm/rebuild-deploy-staging.sh --skip-build  (local build path)

          Rollback: devops/swarm/rollback-runbook.md
          Wave 2: runner voicehub-swarm-staging + VOICEHUB_CD_STAGING_ACTIVE=true
          EOF
          if [[ "${CD_ACTIVE}" == "true" ]]; then
            echo "::error::Staging auto-deploy flag bật nhưng runner chưa self-hosted."
            exit 1
          fi
          echo "delivery_gate=recorded deployed=false"

  smoke-staging:
    name: "CD Smoke — staging"
    needs: [cd-preflight, deploy-staging]
    if: needs.deploy-staging.result == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Smoke checklist staging
        env:
          SHA: ${{ needs.cd-preflight.outputs.sha }}
        run: |
          cat <<EOF
          === Smoke staging ===
          SHA=${SHA}
          - VOICEHUB_ENV_CHECK=staging bash devops/scripts/check-security-env.sh
          - node devops/scripts/smoke-single-company.js
          - voice staging smoke (devops/swarm/voice-staging-smoke.md)
          Wave 2: fail job nếu smoke fail → chặn production.
          EOF

  deploy-production:
    name: "CD Deploy — production"
    needs: [cd-preflight, smoke-staging]
    if: needs.smoke-staging.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Wave 1 / Wave 3 gate — production
        env:
          SHA: ${{ needs.cd-preflight.outputs.sha }}
          OWNER: ${{ github.repository_owner }}
          CD_ACTIVE: ${{ vars.VOICEHUB_CD_PROD_ACTIVE || 'false' }}
        run: |
          set -euo pipefail
          cat <<EOF
          === CD Deploy production ===
          CHỈ pin: ghcr.io/${OWNER}/voicehub/<service>:${SHA}
          Required: Environment production approval trên GitHub.

          deployed_auto=false
          Sau deploy: monitor health + rollback-runbook.md nếu lỗi.

          Wave 3: self-hosted voicehub-swarm-prod + VOICEHUB_CD_PROD_ACTIVE=true
          EOF
          if [[ "${CD_ACTIVE}" == "true" ]]; then
            echo "::error::Prod auto-deploy flag bật nhưng runner chưa self-hosted."
            exit 1
          fi
          echo "delivery_gate=recorded deployed=false"
